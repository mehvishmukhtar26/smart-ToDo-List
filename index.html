<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time!</p>
        </header>

        <main>
            <form id="task-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter a new task..."
                    aria-label="New task"
                >
                <button type="submit" id="add-btn">Add Task</button>
            </form>

            <div class="task-summary">
                <div class="filter-buttons">
    <button type="button" data-filter="all">All</button>
    <button type="button" data-filter="pending">Pending</button>
    <button type="button" data-filter="completed">Completed</button>
</div>
                <p>Your Tasks</p>
                <span id="task-count">0 tasks</span>
            </div>

            <ul id="task-list">
                <!-- Tasks will appear here using JavaScript -->
            </ul>

            <p id="empty-message">No tasks yet. Add your first task!</p>
        </main>

        <footer>
            <p>Smart To-Do List | InternNova Week 5 Project</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
